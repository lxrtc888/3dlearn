<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 协作教学系统 V7.0 - 神经元课堂</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="rtcvx.png">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css?v=40">
</head>

<body>

    <div id="app-container">
        <!-- === 左上：AI老师视频 === -->
        <div id="teacher-section" class="teacher-state-idle">
            <video id="teacher-video" muted playsinline preload="auto" hidden aria-hidden="true">
                您的浏览器不支持视频播放
            </video>
            <div id="teacher-avatar-stage" class="teacher-avatar-stage">
                <canvas id="teacher-avatar-canvas" aria-label="3D AI teacher"></canvas>
                <div id="teacher-avatar-loading" class="teacher-avatar-loading">3D老师加载中</div>
            </div>
            <div id="teacher-avatar-switcher" class="teacher-avatar-switcher" aria-label="切换老师形象" hidden></div>
            <div id="teacher-status" class="teacher-status">
                <span class="teacher-status-dot"></span>
                <span id="teacher-status-text">小静待机中</span>
            </div>
            <div id="teacher-subtitle" class="teacher-subtitle" aria-live="polite"></div>
            <div class="teacher-actions">
                <button id="btn-enable-voice" class="teacher-action-btn" type="button">
                    <i class="fas fa-volume-up"></i>
                    <span>启用语音老师</span>
                </button>
                <button id="btn-stop-voice" class="teacher-action-btn secondary" type="button" hidden>
                    <i class="fas fa-stop"></i>
                    <span>停止朗读</span>
                </button>
            </div>
        </div>

        <!-- === 右侧：多媒体黑板 (扩展版) === -->
        <div id="display-section">
            <!-- Tab 栏 -->
            <div class="tab-bar">
                <div class="tab-btn active" id="tab-scene"><i class="fas fa-cube mr-2"></i>全息演示</div>
                <div class="tab-btn" id="tab-ppt"><i class="fas fa-chalkboard-teacher mr-2"></i>智能课件</div>
                <div class="tab-btn" id="tab-code"><i class="fas fa-code mr-2"></i>后台代码</div>
            </div>
            <!-- 右上角工具栏 - 独立于Tab栏，全屏时也可见 -->
            <div class="scene-toolbar" id="scene-toolbar">
                <!-- 返回场景列表（首页）：仅在进入场景后显示 -->
                <button class="home-btn" id="btn-home" title="返回场景列表" style="display: none;">
                    <i class="fas fa-home"></i>
                </button>
                <button class="fullscreen-btn" id="btn-fullscreen" title="全屏观看">
                    <i class="fas fa-expand"></i>
                </button>
            </div>

            <!-- 内容区域容器 -->
            <div class="content-container">
                <!-- 1. 场景视图 -->
                <div id="view-scene" class="content-view active">
                    <div id="scene-canvas-container" class="w-full h-full absolute inset-0"></div> <!-- Canvas 容器 -->

                    <!-- 侧边信息面板 -->
                    <div id="info-panel" class="info-panel">
                        <div class="info-header">
                            <span id="info-title">信息面板</span>
                            <button onclick="document.getElementById('info-panel').classList.remove('visible')"
                                class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
                        </div>
                        <div id="info-content" class="info-content"></div>
                    </div>

                    <!-- 占位符 + 快捷案例入口 -->
                    <div id="placeholder-text" class="absolute inset-0 flex flex-col items-center justify-start">
                        <!-- 顶部标题区域 -->
                        <div class="text-center mb-3 flex-shrink-0">
                            <div class="relative inline-block mb-2">
                                <i class="fas fa-atom text-3xl text-blue-500 opacity-80 animate-spin-slow"></i>
                                <div class="absolute inset-0 bg-blue-500 blur-xl opacity-20"></div>
                            </div>
                            <h3 class="text-lg font-bold text-gray-100 tracking-wide">AI 教学实验室</h3>
                            <p class="text-xs text-gray-500 mt-1">点击案例卡片开始探索 · 支持分类筛选</p>
                        </div>
                        
                        <!-- 分类Tab栏 -->
                        <div class="category-tabs" id="category-tabs">
                            <button class="category-tab active" data-category="featured">
                                <i class="fas fa-star"></i> 精选场景
                            </button>
                            <button class="category-tab" data-category="physics">
                                <i class="fas fa-atom"></i> 物理
                            </button>
                            <button class="category-tab" data-category="biology">
                                <i class="fas fa-dna"></i> 生物
                            </button>
                            <button class="category-tab" data-category="math">
                                <i class="fas fa-square-root-alt"></i> 数学
                            </button>
                            <button class="category-tab" data-category="ai">
                                <i class="fas fa-robot"></i> AI/算法
                            </button>
                            <button class="category-tab" data-category="thinking">
                                <i class="fas fa-lightbulb"></i> 思维/社科
                            </button>
                            <button class="category-tab" data-category="all">
                                <i class="fas fa-th"></i> 全部
                            </button>
                        </div>
                        
                        <!-- 快捷案例滚动容器 -->
                        <div class="quick-cases-wrapper">
                            <div id="quick-cases" class="quick-cases-grid">
                                <!-- JS动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 动态控制栏 -->
                    <div id="scene-controls" style="display:none;"></div>
                </div>

                <!-- 2. PPT 视图 (V7 明亮版) -->
                <div id="view-ppt" class="content-view">
                    <div class="slide-frame">
                        <div class="slide-bg-deco"></div>
                        <div id="slide-container" class="w-full h-full">
                            <!-- JS 注入 -->
                        </div>
                        <div class="ppt-controls">
                            <button class="ppt-btn" id="btn-prev" title="上一页"><i
                                    class="fas fa-chevron-left text-lg"></i></button>
                            <div id="slide-num" class="px-4 text-lg">1 / 8</div>
                            <button class="ppt-btn" id="btn-next" title="下一页"><i
                                    class="fas fa-chevron-right text-lg"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. 代码视图 -->
                <div id="view-code" class="content-view">
                    <div id="code-content"></div>
                </div>
            </div>
        </div>

        <!-- === 左侧：聊天交互 === -->
        <div id="chat-section">
            <div id="chat-history" class="chat-scroll-area flex flex-col"></div>

            <div class="chat-input-shell relative w-full mt-auto">
                <input type="text" id="user-input" class="glass-input w-full rounded-full px-6 py-4 text-base pr-14"
                    placeholder="输入指令，例如：大模型原理..." autocomplete="off">
                <button id="btn-send"
                    class="absolute right-3 top-3 w-10 h-10 flex items-center justify-center rounded-full text-blue-400 hover:text-white hover:bg-blue-600 transition-all">
                    <i class="fas fa-paper-plane text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            if (window.location.protocol !== 'file:') return;

            function showLocalServerNotice() {
                var section = document.getElementById('teacher-section');
                var stage = document.getElementById('teacher-avatar-stage');
                var canvas = document.getElementById('teacher-avatar-canvas');
                var loading = document.getElementById('teacher-avatar-loading');
                var switcher = document.getElementById('teacher-avatar-switcher');

                if (section) section.classList.add('teacher-avatar-direct-file');
                if (stage) stage.hidden = false;
                if (canvas) canvas.hidden = true;
                if (loading) {
                    loading.hidden = false;
                    loading.textContent = '请运行 start.bat 后打开 http://localhost:8000/app.html';
                }
                if (switcher) {
                    switcher.hidden = false;
                    switcher.querySelectorAll('button').forEach(function (button) {
                        button.disabled = true;
                        button.title = '请通过本地服务打开后切换形象';
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', showLocalServerNotice, { once: true });
            } else {
                showLocalServerNotice();
            }
        })();
    </script>

    <!-- 核心脚本 (顺序加载) -->
    <script src="js/ai-service.js?v=2"></script>
    <script src="js/scene-manager.js?v=15"></script>
    
    <!-- 数据模块 -->
    <script src="data/cases-config.js?v=17"></script>
    <script src="data/code-snippets.js?v=17"></script>
    <script src="data/slides.js?v=12"></script>
    <script src="data/learning-path-config.js?v=3"></script>
    <script src="data/quiz-bank.js?v=3"></script>
    <script src="js/learning-engine.js?v=3"></script>

    <!-- 场景懒加载器 -->
    <script src="js/scene-loader.js?v=3"></script>

    <!-- 主程序 -->
    <script src="js/voice-tutor-live.js?v=9"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/",
                "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2/lib/three-vrm.module.js"
            }
        }
    </script>
    <script type="module" src="js/avatar-tutor.js?v=20"></script>
    <script src="js/app.js?v=34"></script>

</body>

</html>
