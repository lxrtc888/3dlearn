<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 协作教学系统 V7.0 - 神经元课堂</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css?v=30">
</head>

<body>

    <div id="app-container">
        <!-- === 左上：AI老师视频 === -->
        <div id="teacher-section">
            <video id="teacher-video" autoplay loop muted playsinline>
                <source src="assets/Avatar IV Video.mp4" type="video/mp4">
                您的浏览器不支持视频播放
            </video>
        </div>

        <!-- === 右侧：多媒体黑板 (扩展版) === -->
        <div id="display-section">
            <!-- Tab 栏 -->
            <div class="tab-bar">
                <div class="tab-btn active" id="tab-scene"><i class="fas fa-cube mr-2"></i>全息演示</div>
                <div class="tab-btn" id="tab-ppt"><i class="fas fa-chalkboard-teacher mr-2"></i>智能课件</div>
                <div class="tab-btn" id="tab-code"><i class="fas fa-code mr-2"></i>后台代码</div>
            </div>
            <!-- 全屏按钮 - 独立于Tab栏，全屏时也可见 -->
            <button class="fullscreen-btn" id="btn-fullscreen" title="全屏观看">
                <i class="fas fa-expand"></i>
            </button>

            <!-- 内容区域容器 -->
            <div class="content-container">
                <!-- 1. 场景视图 -->
                <div id="view-scene" class="content-view active">
                    <div id="scene-canvas-container" class="w-full h-full absolute inset-0"></div> <!-- Canvas 容器 -->

                    <!-- 侧边信息面板 -->
                    <div id="info-panel" class="info-panel">
                        <div class="info-header">
                            <span id="info-title">信息面板</span>
                            <button onclick="document.getElementById('info-panel').classList.remove('visible')"
                                class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
                        </div>
                        <div id="info-content" class="info-content"></div>
                    </div>

                    <!-- 占位符 + 快捷案例入口 -->
                    <div id="placeholder-text" class="absolute inset-0 flex flex-col items-center justify-start">
                        <!-- 顶部标题区域 -->
                        <div class="text-center mb-3 flex-shrink-0">
                            <div class="relative inline-block mb-2">
                                <i class="fas fa-atom text-3xl text-blue-500 opacity-80 animate-spin-slow"></i>
                                <div class="absolute inset-0 bg-blue-500 blur-xl opacity-20"></div>
                            </div>
                            <h3 class="text-lg font-bold text-gray-100 tracking-wide">AI 教学实验室</h3>
                            <p class="text-xs text-gray-500 mt-1">点击案例卡片开始探索 · 支持分类筛选</p>
                        </div>
                        
                        <!-- 分类Tab栏 -->
                        <div class="category-tabs" id="category-tabs">
                            <button class="category-tab active" data-category="featured">
                                <i class="fas fa-star"></i> 精选场景
                            </button>
                            <button class="category-tab" data-category="physics">
                                <i class="fas fa-atom"></i> 物理
                            </button>
                            <button class="category-tab" data-category="biology">
                                <i class="fas fa-dna"></i> 生物
                            </button>
                            <button class="category-tab" data-category="math">
                                <i class="fas fa-square-root-alt"></i> 数学
                            </button>
                            <button class="category-tab" data-category="ai">
                                <i class="fas fa-robot"></i> AI/算法
                            </button>
                            <button class="category-tab" data-category="thinking">
                                <i class="fas fa-lightbulb"></i> 思维/社科
                            </button>
                            <button class="category-tab" data-category="all">
                                <i class="fas fa-th"></i> 全部
                            </button>
                        </div>
                        
                        <!-- 快捷案例滚动容器 -->
                        <div class="quick-cases-wrapper">
                            <div id="quick-cases" class="quick-cases-grid">
                                <!-- JS动态生成 -->
                            </div>
                        </div>
                    </div>

                    <!-- 动态控制栏 -->
                    <div id="scene-controls" style="display:none;"></div>
                </div>

                <!-- 2. PPT 视图 (V7 明亮版) -->
                <div id="view-ppt" class="content-view">
                    <div class="slide-frame">
                        <div class="slide-bg-deco"></div>
                        <div id="slide-container" class="w-full h-full">
                            <!-- JS 注入 -->
                        </div>
                        <div class="ppt-controls">
                            <button class="ppt-btn" id="btn-prev" title="上一页"><i
                                    class="fas fa-chevron-left text-lg"></i></button>
                            <div id="slide-num" class="px-4 text-lg">1 / 8</div>
                            <button class="ppt-btn" id="btn-next" title="下一页"><i
                                    class="fas fa-chevron-right text-lg"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. 代码视图 -->
                <div id="view-code" class="content-view">
                    <div id="code-content"></div>
                </div>
            </div>
        </div>

        <!-- === 左侧：聊天交互 === -->
        <div id="chat-section">
            <div id="chat-history" class="chat-scroll-area flex flex-col"></div>

            <div class="chat-input-shell relative w-full mt-auto">
                <input type="text" id="user-input" class="glass-input w-full rounded-full px-6 py-4 text-base pr-14"
                    placeholder="输入指令，例如：大模型原理..." autocomplete="off">
                <button id="btn-send"
                    class="absolute right-3 top-3 w-10 h-10 flex items-center justify-center rounded-full text-blue-400 hover:text-white hover:bg-blue-600 transition-all">
                    <i class="fas fa-paper-plane text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 核心脚本 (顺序加载) -->
    <script src="js/ai-service.js?v=1"></script>
    <script src="js/scene-manager.js?v=13"></script>
    
    <!-- 数据模块 -->
    <script src="data/cases-config.js?v=15"></script>
    <script src="data/code-snippets.js?v=15"></script>
    <script src="data/slides.js?v=12"></script>

    <!-- 场景模块 -->
    <script src="scenes/attention-scene.js?v=12"></script>
    <script src="scenes/quantum-scene.js?v=12"></script>
    <script src="scenes/hydraulic-scene.js?v=12"></script>
    <script src="scenes/engine-scene.js?v=12"></script>
    <script src="scenes/pendulum-scene.js?v=12"></script>
    <script src="scenes/electromagnetic-scene.js?v=12"></script>
    <script src="scenes/cell-scene.js?v=12"></script>
    <script src="scenes/dna-scene.js?v=12"></script>
    <script src="scenes/vector3d-scene.js?v=12"></script>
    <script src="scenes/conic-scene.js?v=12"></script>
    <script src="scenes/drum-flower-scene.js?v=12"></script>
    <script src="scenes/flagellar-scene.js?v=12"></script>
    <script src="scenes/gravity-scene.js?v=5"></script>
    <script src="scenes/nuclear-fission-scene.js?v=1"></script>
    <script src="scenes/migdal-scene.js?v=1"></script>
    <script src="scenes/schrodinger-cat-scene.js?v=1"></script>
    <script src="scenes/tesseract-scene.js?v=2"></script>
    <script src="scenes/photosynthesis-scene.js?v=3"></script>
    <script src="scenes/gradient-descent-scene.js?v=1"></script>
    <script src="scenes/neuron-signal-scene.js?v=5"></script>
    <script src="scenes/sorting-scene.js?v=1"></script>
    <script src="scenes/kmeans-scene.js?v=1"></script>
    <script src="scenes/maze-scene.js?v=2"></script>
    <script src="scenes/quantum-entanglement-scene.js?v=1"></script>
    <script src="scenes/orbital-mechanics-scene.js?v=1"></script>
    <script src="scenes/klein-bottle-scene.js?v=1"></script>
    <script src="scenes/euler-formula-scene.js?v=1"></script>
    <script src="scenes/fourier-scene.js?v=1"></script>
    <script src="scenes/three-body-scene.js?v=1"></script>
    <script src="scenes/mandelbrot-scene.js?v=1"></script>
    <script src="scenes/sir-model-scene.js?v=1"></script>
    <script src="scenes/dimensional-strike-scene.js?v=1"></script>
    <script src="scenes/boids-scene.js?v=1"></script>
    <script src="scenes/doppler-effect-scene.js?v=1"></script>
    <script src="scenes/entropy-scene.js?v=1"></script>
    <script src="scenes/traffic-flow-scene.js?v=1"></script>
    <script src="scenes/golden-spiral-scene.js?v=1"></script>
    <script src="scenes/prisoners-dilemma-scene.js?v=1"></script>
    <script src="scenes/plato-cave-scene.js?v=1"></script>
    <script src="scenes/lorenz-attractor-scene.js?v=1"></script>
    <script src="scenes/game-of-life-scene.js?v=1"></script>
    <script src="scenes/six-degrees-scene.js?v=1"></script>
    <script src="scenes/herd-behavior-scene.js?v=3"></script>
    <script src="scenes/compound-interest-scene.js?v=1"></script>
    <script src="scenes/tragedy-of-commons-scene.js?v=1"></script>
    <script src="scenes/husky-battle-scene.js?v=1"></script>
    <script src="scenes/geometry-problem-scene.js?v=3"></script>
    <script src="scenes/solid-geometry-scene.js?v=2"></script>

    <!-- 主程序 -->
    <script src="js/app.js?v=25"></script>

</body>

</html>
