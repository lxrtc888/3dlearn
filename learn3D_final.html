<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 协作教学系统 V7.0 - 神经元课堂</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app-container">
    <!-- 背景图 -->
    <img id="bg-image" src="https://s1.imagehub.cc/images/2025/12/03/78c683e1c62e4fad2fd8594d1dc8c07c.jpg" 
         onerror="console.error('背景图片加载失败')">

    <!-- === 左上：AI老师视频 === -->
    <div id="teacher-section">
        <video id="teacher-video" autoplay loop muted playsinline>
            <source src="Avatar IV Video.mp4" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
    </div>

    <!-- === 右侧：多媒体黑板 === -->
    <div id="display-section">
        <!-- Tab 栏 -->
        <div class="tab-bar">
            <div class="tab-btn active" onclick="switchTab('scene')" id="tab-scene">
                <i class="fas fa-cube mr-2"></i>全息演示
            </div>
            <div class="tab-btn" onclick="switchTab('ppt')" id="tab-ppt">
                <i class="fas fa-chalkboard-teacher mr-2"></i>智能课件
            </div>
            <div class="tab-btn" onclick="switchTab('code')" id="tab-code">
                <i class="fas fa-code mr-2"></i>后台代码
            </div>
        </div>

        <!-- 内容区域容器 -->
        <div class="content-container">
            <!-- 1. 场景视图 -->
            <div id="view-scene" class="content-view active">
                <div id="scene-canvas-container" class="w-full h-full absolute inset-0"></div>
                
                <!-- 占位符 -->
                <div id="placeholder-text" class="absolute inset-0 flex items-center justify-center text-gray-400 pointer-events-none">
                    <div class="text-center p-10 border-2 border-dashed border-gray-600/50 rounded-3xl bg-black/40 backdrop-blur-md">
                        <div class="relative inline-block mb-6">
                            <i class="fas fa-atom text-7xl text-blue-500 opacity-80 animate-spin-slow"></i>
                            <div class="absolute inset-0 bg-blue-500 blur-2xl opacity-30"></div>
                        </div>
                        <h3 class="text-2xl font-bold mb-3 text-gray-100 tracking-wide">AI 教学实验室</h3>
                        <p class="text-base opacity-70 mb-4">请输入指令探索物理与AI世界</p>
                        <div class="flex gap-2 justify-center text-sm">
                            <span class="px-3 py-1.5 bg-blue-500/20 text-blue-300 rounded-full border border-blue-500/30">
                                <i class="fas fa-brain mr-1"></i> LLM原理
                            </span>
                            <span class="px-3 py-1.5 bg-purple-500/20 text-purple-300 rounded-full border border-purple-500/30">
                                <i class="fas fa-wave-square mr-1"></i> 双缝干涉
                            </span>
                        </div>
                    </div>
                </div>
                
                <!-- 动态控制栏 -->
                <div id="scene-controls" style="display:none;"></div>
            </div>

            <!-- 2. PPT 视图 -->
            <div id="view-ppt" class="content-view">
                <div class="slide-frame">
                    <div class="slide-bg-deco"></div>
                    <div id="slide-container" class="w-full h-full">
                        <!-- JS 动态注入 -->
                    </div>
                    <div class="ppt-controls">
                        <button class="ppt-btn" onclick="prevSlide()" id="btn-prev" title="上一页">
                            <i class="fas fa-chevron-left text-lg"></i>
                        </button>
                        <div id="slide-num" class="px-4 text-lg">1 / 8</div>
                        <button class="ppt-btn" onclick="nextSlide()" id="btn-next" title="下一页">
                            <i class="fas fa-chevron-right text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3. 代码视图 -->
            <div id="view-code" class="content-view">
                <div id="code-content"></div>
            </div>
        </div>
    </div>

    <!-- === 左下：聊天交互 === -->
    <div id="chat-section">
        <div id="chat-history" class="chat-scroll-area flex flex-col"></div>

        <div class="relative w-full mt-auto">
            <input type="text" id="user-input" 
                class="glass-input w-full rounded-full px-6 py-4 text-base pr-14" 
                placeholder="输入指令，例如：大模型原理..." 
                autocomplete="off">
            <button onclick="handleSend()" 
                class="absolute right-3 top-3 w-10 h-10 flex items-center justify-center rounded-full text-blue-400 hover:text-white hover:bg-blue-600 transition-all">
                <i class="fas fa-paper-plane text-lg"></i>
            </button>
        </div>
    </div>
</div>

<!-- 使用原版的完整JavaScript逻辑 -->
<script type="module">
    // 导入模块
    import { slides } from './js/data/slides.js';
    import { codeSnippets } from './js/data/codeSnippets.js';
    import { SceneManager } from './js/core/SceneManager.js';
    
    // ================= 全局状态 =================
    const state = {
        currentTopic: null,
        activeTab: 'scene',
        pptIndex: 0,
        sceneManager: null
    };
    
    // DOM元素
    const chatHistory = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sceneContainer = document.getElementById('scene-canvas-container');
    const codeContent = document.getElementById('code-content');
    const slideContainer = document.getElementById('slide-container');
    const sceneControls = document.getElementById('scene-controls');
    
    // 初始化场景管理器
    state.sceneManager = new SceneManager(sceneContainer);
    
    // ================= 聊天逻辑 =================
    userInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });
    
    setTimeout(() => {
        addMessage('ai', '👋 欢迎回到神经元课堂。');
        addMessage('ai', '我是您的 AI 助教。今天准备了一些非常酷的演示：<br>1. <b>[大模型原理]</b> - 交互式 3D 网络 (New!)<br>2. <b>[V6发动机]</b> - 赛博机械美学<br>3. <b>[双缝干涉]</b> - 量子力学"观察者效应"<br>4. <b>[液压系统]</b> - 流体力学<br>5. <b>[原理课件]</b> - 8页详解 PPT');
    }, 800);
    
    window.handleSend = function() {
        const text = userInput.value.trim();
        if(!text) return;
        addMessage('user', text);
        userInput.value = '';
        analyzeIntent(text);
    };
    
    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `chat-bubble bubble-${role} flex flex-col`;
        div.innerHTML = text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }
    
    window.addMessage = addMessage; // 暴露给场景使用
    
    function analyzeIntent(text) {
        let topic = null;
        let type = 'scene';
        let title = '';
        
        if(text.includes('发动机') || text.includes('引擎')) { 
            topic = 'engine'; 
            title = 'V6 赛博引擎'; 
        }
        else if(text.includes('双缝') || text.includes('干涉') || text.includes('量子')) { 
            topic = 'quantum'; 
            title = '双缝干涉 (观察者效应)'; 
        }
        else if(text.includes('液压') || text.includes('水压')) { 
            topic = 'hydraulic'; 
            title = '液压传动系统'; 
        }
        else if(text.includes('大模型') && (text.includes('交互') || text.includes('3D'))) { 
            topic = 'llm'; 
            title = 'LLM 注意力网络 (3D交互)'; 
        }
        else if(text.includes('大模型') || text.includes('PPT') || text.includes('原理') || text.includes('课件')) { 
            topic = 'ppt'; 
            type = 'ppt'; 
            title = 'LLM 原理课件 (8页)'; 
        }
        else {
            setTimeout(() => addMessage('ai', '🤔 请尝试输入关键词，例如"大模型3D"、"双缝干涉"或"原理课件"。'), 600);
            return;
        }
        
        setTimeout(() => {
            const confirmHtml = `
                <div class="font-bold mb-2 text-blue-300 flex items-center"><i class="fas fa-check-circle mr-2"></i> 资源就绪</div>
                <div class="text-sm text-gray-300 mb-4 bg-black/20 p-3 rounded-lg border border-white/10">
                    <div class="mb-1"><span class="text-gray-500">Subject:</span> <span class="font-medium text-white">${title}</span></div>
                    <div><span class="text-gray-500">Mode:</span> <span class="font-medium text-white">${type === 'ppt' ? 'Interactive Slide' : 'WebGL Simulation'}</span></div>
                </div>
                <button onclick="startGeneration('${topic}', '${type}')" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl transition shadow-lg flex items-center justify-center font-bold tracking-wide group text-base">
                    <i class="fas fa-play mr-2 group-hover:scale-110 transition-transform"></i> 立即加载
                </button>
            `;
            const div = document.createElement('div');
            div.className = 'confirm-card chat-bubble bubble-ai';
            div.innerHTML = confirmHtml;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }, 600);
    }
    
    window.startGeneration = async function(topic, type) {
        state.currentTopic = topic;
        switchTab('code');
        
        // 代码打字效果
        codeContent.innerHTML = '';
        codeContent.className = 'cursor';
        
        const snippet = codeSnippets[topic] || codeSnippets['llm'] || "// Loading advanced modules...";
        let i = 0;
        const typingSpeed = 2;
        
        function typeWriter() {
            if (i < snippet.length) {
                codeContent.innerHTML += snippet.charAt(i);
                i++;
                document.getElementById('view-code').scrollTop = document.getElementById('view-code').scrollHeight;
                setTimeout(typeWriter, typingSpeed);
            } else {
                codeContent.classList.remove('cursor');
                finishGeneration(type);
            }
        }
        typeWriter();
    };
    
    async function finishGeneration(type) {
        setTimeout(async () => {
            if (type === 'ppt') {
                addMessage('ai', '✅ <b>课件已投屏。</b><br>请使用右下角按钮翻页。');
                switchTab('ppt');
                renderSlide(0);
            } else {
                addMessage('ai', '✅ <b>全息场景构建完成。</b><br>您可以拖动旋转视角。<br>部分场景支持点击交互。');
                switchTab('scene');
                await runScene(state.currentTopic);
            }
        }, 600);
    }
    
    async function runScene(topic) {
        document.getElementById('placeholder-text').style.display = 'none';
        
        const sceneMap = {
            'engine': 'Engine',
            'quantum': 'Quantum',
            'hydraulic': 'Hydraulic',
            'llm': 'LLM'
        };
        
        const sceneName = sceneMap[topic];
        if (!sceneName) return;
        
        try {
            await state.sceneManager.loadScene(sceneName);
            
            const controls = state.sceneManager.getCurrentControls();
            if (controls) {
                sceneControls.innerHTML = controls;
                sceneControls.style.display = 'flex';
                
                // 双缝干涉观察者按钮
                if (topic === 'quantum') {
                    const btnObserver = document.getElementById('btn-observer');
                    if (btnObserver) {
                        btnObserver.addEventListener('click', () => {
                            const scene = state.sceneManager.currentScene;
                            const isActive = scene.toggleObserver();
                            
                            if (isActive) {
                                btnObserver.innerHTML = '<i class="fas fa-eye"></i><span>移除观察者</span>';
                                btnObserver.classList.add('active');
                                addMessage('ai', '👁️ <b>观察者介入！</b>波函数坍缩，表现为粒子性。');
                            } else {
                                btnObserver.innerHTML = '<i class="fas fa-eye-slash"></i><span>放置观察者</span>';
                                btnObserver.classList.remove('active');
                                addMessage('ai', '🙈 <b>观察者移除。</b>恢复波动性，形成干涉条纹。');
                            }
                        });
                    }
                }
            } else {
                sceneControls.style.display = 'none';
            }
        } catch (error) {
            console.error('加载场景失败:', error);
            addMessage('ai', '❌ 场景加载失败，请重试。');
        }
    }
    
    window.switchTab = function(tabName) {
        state.activeTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');
        document.querySelectorAll('.content-view').forEach(view => view.classList.remove('active'));
        document.getElementById(`view-${tabName}`).classList.add('active');
    };
    
    // ================= PPT 渲染 =================
    function renderSlide(index) {
        state.pptIndex = index;
        const slide = slides[index];
        
        slideContainer.innerHTML = `
            <div class="slide-content h-full">
                <div class="slide-header">
                    <div class="slide-title">${slide.title}</div>
                    <div class="slide-subtitle">${slide.subtitle}</div>
                </div>
                <div class="slide-body">${slide.content}</div>
            </div>
        `;
        
        document.getElementById('slide-num').innerText = `${index + 1} / ${slides.length}`;
        document.getElementById('btn-prev').disabled = index === 0;
        document.getElementById('btn-next').disabled = index === slides.length - 1;
    }
    
    window.nextSlide = function() {
        if (state.pptIndex < slides.length - 1) renderSlide(state.pptIndex + 1);
    };
    
    window.prevSlide = function() {
        if (state.pptIndex > 0) renderSlide(state.pptIndex - 1);
    };
</script>

</body>
</html>
