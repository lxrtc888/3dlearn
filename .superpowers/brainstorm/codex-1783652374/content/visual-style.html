<h2>选择双角色宠物的画风</h2>
<p class="subtitle">角色保持为马力欧和酷霸王，区别只在于动画表现与小尺寸可读性。</p>

<div class="cards">
  <div class="card" data-choice="pixel" onclick="toggleSelect(this)">
    <div class="card-image" style="min-height:190px;background:#8fd3ff;display:flex;align-items:flex-end;justify-content:center;gap:22px;padding:22px;image-rendering:pixelated">
      <div style="width:72px;height:112px;background:#e52521;box-shadow:0 -22px 0 #e52521,18px 0 0 #f3c49b,0 42px 0 #1357a6,18px 66px 0 #6b3e1f"></div>
      <div style="width:102px;height:124px;background:#4c9a43;box-shadow:0 -24px 0 #f0bd32,-20px 22px 0 #f0f0d0,20px 22px 0 #f0f0d0,0 58px 0 #d77c21"></div>
    </div>
    <div class="card-body">
      <h3>A. 经典像素风</h3>
      <p>最像游戏桌面宠物，轮廓清楚、动作夸张，推荐。</p>
    </div>
  </div>

  <div class="card" data-choice="cartoon" onclick="toggleSelect(this)">
    <div class="card-image" style="min-height:190px;background:#bfe7ff;display:flex;align-items:flex-end;justify-content:center;gap:20px;padding:22px">
      <div style="width:78px;height:116px;border:8px solid #272727;border-radius:38px 38px 20px 20px;background:#e52521;box-shadow:18px 32px 0 #1357a6"></div>
      <div style="width:110px;height:132px;border:8px solid #272727;border-radius:48px 48px 28px 28px;background:#4c9a43;box-shadow:0 30px 0 #d77c21"></div>
    </div>
    <div class="card-body">
      <h3>B. 2D 卡通插画</h3>
      <p>表情更丰富，互动更有喜剧感，但细节会更密。</p>
    </div>
  </div>

  <div class="card" data-choice="toy3d" onclick="toggleSelect(this)">
    <div class="card-image" style="min-height:190px;background:#d9eff7;display:flex;align-items:flex-end;justify-content:center;gap:22px;padding:22px">
      <div style="width:80px;height:120px;border-radius:44px 44px 22px 22px;background:linear-gradient(135deg,#ff716d,#b90f0b);box-shadow:14px 18px 18px rgba(0,0,0,.28)"></div>
      <div style="width:112px;height:136px;border-radius:58px 58px 34px 34px;background:linear-gradient(135deg,#81c867,#246c2d);box-shadow:16px 20px 18px rgba(0,0,0,.3)"></div>
    </div>
    <div class="card-body">
      <h3>C. 3D 玩具风</h3>
      <p>质感突出、接近现代主机宣传图，小尺寸动作辨识略弱。</p>
    </div>
  </div>
</div>
