<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 协作教学系统 V7.0 - 神经元课堂</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css?v=12">
</head>

<body>

    <div id="app-container">
        <!-- === 左上：AI老师视频 === -->
        <div id="teacher-section">
            <video id="teacher-video" autoplay loop muted playsinline>
                <source src="assets/Avatar IV Video.mp4" type="video/mp4">
                您的浏览器不支持视频播放
            </video>
        </div>

        <!-- === 右侧：多媒体黑板 (扩展版) === -->
        <div id="display-section">
            <!-- Tab 栏 -->
            <div class="tab-bar">
                <div class="tab-btn active" id="tab-scene"><i class="fas fa-cube mr-2"></i>全息演示</div>
                <div class="tab-btn" id="tab-ppt"><i class="fas fa-chalkboard-teacher mr-2"></i>智能课件</div>
                <div class="tab-btn" id="tab-code"><i class="fas fa-code mr-2"></i>后台代码</div>
            </div>

            <!-- 内容区域容器 -->
            <div class="content-container">
                <!-- 1. 场景视图 -->
                <div id="view-scene" class="content-view active">
                    <div id="scene-canvas-container" class="w-full h-full absolute inset-0"></div> <!-- Canvas 容器 -->
                    
                    <!-- 全屏按钮（移动端显示） -->
                    <button class="fullscreen-btn" id="btn-fullscreen" title="全屏观看">
                        <i class="fas fa-expand"></i>
                    </button>

                    <!-- 侧边信息面板 -->
                    <div id="info-panel" class="info-panel">
                        <div class="info-header">
                            <span id="info-title">信息面板</span>
                            <button onclick="document.getElementById('info-panel').classList.remove('visible')"
                                class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
                        </div>
                        <div id="info-content" class="info-content"></div>
                    </div>

                    <!-- 占位符 + 快捷案例入口 -->
                    <div id="placeholder-text" class="absolute inset-0 flex flex-col items-center justify-center">
                        <!-- 顶部标题区域 -->
                        <div class="text-center mb-8">
                            <div class="relative inline-block mb-4">
                                <i class="fas fa-atom text-5xl text-blue-500 opacity-80 animate-spin-slow"></i>
                                <div class="absolute inset-0 bg-blue-500 blur-2xl opacity-25"></div>
                            </div>
                            <h3 class="text-2xl font-bold text-gray-100 tracking-wide">AI 教学实验室</h3>
                            <p class="text-sm text-gray-400 mt-2">点击案例卡片开始探索</p>
                        </div>
                        
                        <!-- 快捷案例网格 -->
                        <div id="quick-cases" class="quick-cases-grid">
                            <!-- JS动态生成 -->
                        </div>
                    </div>

                    <!-- 动态控制栏 -->
                    <div id="scene-controls" style="display:none;"></div>
                </div>

                <!-- 2. PPT 视图 (V7 明亮版) -->
                <div id="view-ppt" class="content-view">
                    <div class="slide-frame">
                        <div class="slide-bg-deco"></div>
                        <div id="slide-container" class="w-full h-full">
                            <!-- JS 注入 -->
                        </div>
                        <div class="ppt-controls">
                            <button class="ppt-btn" id="btn-prev" title="上一页"><i
                                    class="fas fa-chevron-left text-lg"></i></button>
                            <div id="slide-num" class="px-4 text-lg">1 / 8</div>
                            <button class="ppt-btn" id="btn-next" title="下一页"><i
                                    class="fas fa-chevron-right text-lg"></i></button>
                        </div>
                    </div>
                </div>

                <!-- 3. 代码视图 -->
                <div id="view-code" class="content-view">
                    <div id="code-content"></div>
                </div>
            </div>
        </div>

        <!-- === 左侧：聊天交互 === -->
        <div id="chat-section">
            <div id="chat-history" class="chat-scroll-area flex flex-col"></div>

            <div class="chat-input-shell relative w-full mt-auto">
                <input type="text" id="user-input" class="glass-input w-full rounded-full px-6 py-4 text-base pr-14"
                    placeholder="输入指令，例如：大模型原理..." autocomplete="off">
                <button id="btn-send"
                    class="absolute right-3 top-3 w-10 h-10 flex items-center justify-center rounded-full text-blue-400 hover:text-white hover:bg-blue-600 transition-all">
                    <i class="fas fa-paper-plane text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 核心脚本 (顺序加载) -->
    <script src="js/scene-manager.js?v=12"></script>
    
    <!-- 数据模块 -->
    <script src="data/cases-config.js?v=12"></script>
    <script src="data/code-snippets.js?v=12"></script>
    <script src="data/slides.js?v=12"></script>

    <!-- 场景模块 -->
    <script src="scenes/attention-scene.js?v=12"></script>
    <script src="scenes/quantum-scene.js?v=12"></script>
    <script src="scenes/hydraulic-scene.js?v=12"></script>
    <script src="scenes/engine-scene.js?v=12"></script>
    <script src="scenes/pendulum-scene.js?v=12"></script>
    <script src="scenes/electromagnetic-scene.js?v=12"></script>
    <script src="scenes/cell-scene.js?v=12"></script>
    <script src="scenes/dna-scene.js?v=12"></script>
    <script src="scenes/vector3d-scene.js?v=12"></script>
    <script src="scenes/conic-scene.js?v=12"></script>
    <script src="scenes/drum-flower-scene.js?v=12"></script>

    <!-- 主程序 -->
    <script src="js/app.js?v=12"></script>

</body>

</html>
